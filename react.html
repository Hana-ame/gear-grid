<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gear Grid · React</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#05050f;--fg:#e8ecf5;--muted:#6b7394}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--fg);background:radial-gradient(ellipse at 50% 0%,#1a1a3e 0%,#0a0a1c 40%,var(--bg) 100%);overflow:hidden}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;background:#fff;border-radius:50%;opacity:.3;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(1)}50%{opacity:.7;transform:scale(1.3)}}
.demo{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.demo h1{font-size:32px;font-weight:200;letter-spacing:10px;padding-left:10px;background:linear-gradient(135deg,#9fb4d4,#b48ce0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
.demo p{color:var(--muted);font-size:13px;line-height:1.7;max-width:380px}
.demo small{display:block;margin-top:24px;padding:8px 16px;border-radius:8px;border:1px dashed rgba(180,140,224,.2);color:var(--muted);font-size:10px;letter-spacing:1px}
.fab{position:fixed;bottom:24px;right:24px;z-index:100;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:24px;border:1px solid rgba(255,255,255,.15);background:rgba(14,14,32,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--fg);font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .3s cubic-bezier(.34,1.4,.64,1);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.fab:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.fab .f-glyph{font-size:15px;filter:drop-shadow(0 0 3px currentColor)}
.fab .f-dots{display:flex;gap:2px;margin-left:2px}
.fab .f-dots i{width:4px;height:4px;border-radius:50%;display:block}
.dialog{position:fixed;bottom:80px;right:24px;z-index:200;width:min(520px,calc(100vw - 48px));max-height:calc(100vh - 130px);overflow-y:auto;background:rgba(14,14,32,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:24px;box-shadow:0 32px 64px -12px rgba(0,0,0,.6);transform-origin:bottom right;transform:scale(.92) translateY(10px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,visibility 0s .25s,transform .3s}
.dialog.open{opacity:1;visibility:visible;pointer-events:auto;transform:scale(1) translateY(0);transition:opacity .25s,visibility 0s 0s,transform .35s cubic-bezier(.34,1.4,.64,1)}
.grid{display:grid;grid-template-columns:36px repeat(var(--cols),1fr);grid-template-rows:auto repeat(var(--rows),1fr);gap:5px;height:280px;position:relative}
.alabel{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:9px;font-weight:500;letter-spacing:2px;text-transform:uppercase}
.alabel.ylabel{writing-mode:vertical-rl;transform:rotate(180deg)}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:8px;border:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.02);cursor:pointer;transition:all .25s cubic-bezier(.4,0,.2,1);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
.cell::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,currentColor 0%,transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.cell:hover{border-color:rgba(255,255,255,.2);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.cell:hover::before{opacity:.12}
.cell:focus,.cell:focus-visible{outline:3px solid rgba(255,255,255,.8);outline-offset:2px;z-index:3}
.cell .glyph{font-size:18px;line-height:1;margin-bottom:2px;filter:drop-shadow(0 0 4px currentColor);z-index:1}
.cell .name{font-size:8px;font-weight:600;letter-spacing:1px;text-transform:uppercase;opacity:0;transition:opacity .2s;z-index:1;text-align:center;line-height:1.2}
.cell.selected .name{opacity:.9}
.cell .dots{display:flex;gap:2px;margin-top:4px;z-index:1}
.cell .dots i{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.12);display:block;transition:all .3s}
.cell .dots i.on{background:currentColor;box-shadow:0 0 3px currentColor}
.cell.selected{border-color:currentColor;opacity:1;transform:scale(1.05);box-shadow:0 0 20px currentColor,0 0 40px currentColor,inset 0 0 10px rgba(255,255,255,.1);z-index:2}
.cell.selected::before{opacity:.2}
.cell.hl-row{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.07);opacity:.8}
.cell.hl-col{border-color:currentColor;background:rgba(255,255,255,.05);opacity:.8;box-shadow:inset 0 0 8px currentColor}
.stick{position:absolute;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#b48ce0 60%,transparent);box-shadow:0 0 14px #b48ce0,0 0 28px #b48ce0;pointer-events:none;transition:left .4s cubic-bezier(.34,1.4,.64,1),top .4s cubic-bezier(.34,1.4,.64,1);z-index:10;transform:translate(-50%,-50%);opacity:.9}
.stick.dragging{width:22px;height:22px}
.stick::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:1px solid #b48ce0;opacity:.4;animation:pr 2s ease-out infinite}
@keyframes pr{0%{transform:scale(1);opacity:.4}100%{transform:scale(2);opacity:0}}
.readout{margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.06);text-align:center}
.readout .gear{font-size:22px;font-weight:200;letter-spacing:2px;margin-bottom:2px;transition:color .4s;min-height:28px}
.readout .gear.flash{animation:fl .4s ease-out}
@keyframes fl{0%{transform:scale(1)}30%{transform:scale(1.08)}100%{transform:scale(1)}}
.readout .sub{color:var(--muted);font-size:10px;letter-spacing:2px;text-transform:uppercase}
.legend{display:flex;justify-content:center;gap:16px;margin-top:16px;color:var(--muted);font-size:8px;letter-spacing:2px;text-transform:uppercase;flex-wrap:wrap}
.legend kbd{display:inline-block;padding:1px 4px;border-radius:3px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);font-family:ui-monospace,monospace;font-size:7px;margin:0 1px;letter-spacing:0}
@media(max-width:520px){.demo h1{font-size:24px;letter-spacing:7px}.demo p{font-size:12px}.dialog{padding:16px;bottom:64px;right:16px;width:calc(100vw - 32px);max-height:calc(100vh - 90px)}.grid{height:240px;grid-template-columns:30px repeat(var(--cols),1fr)}.cell .glyph{font-size:15px}.readout .gear{font-size:18px}.fab{bottom:16px;right:16px;padding:8px 14px;font-size:12px}}
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const COLUMNS = ['luna','terra','sol','astra'];
const ROWS = ['high','medium','low'];
const COLORS = ['#9fb4d4','#7fb07a','#f0a040','#b48ce0'];
const GLYPHS = ['\u263E','\u2295','\u2609','\u2726'];

function App() {
  const [cur, setCur] = React.useState({ col: COLUMNS[2], row: ROWS[1] });
  const [open, setOpen] = React.useState(false);
  const [dragging, setDragging] = React.useState(false);
  const gridRef = React.useRef(null);
  const stickRef = React.useRef(null);
  const closeTimer = React.useRef(null);
  const lastDrag = React.useRef(null);

  function select(col, row, isDrag) {
    if (cur.col === col && cur.row === row) return;
    setCur({ col, row });
    if (!isDrag) updateStick();
  }

  function updateStick() {
    const g = gridRef.current;
    const s = stickRef.current;
    if (!g || !s) return;
    const gr = g.getBoundingClientRect();
    const sel = g.querySelector('.cell.selected');
    if (!sel) return;
    const cr = sel.getBoundingClientRect();
    s.style.transition = 'none';
    s.style.left = (cr.left - gr.left + cr.width / 2) + 'px';
    s.style.top = (cr.top - gr.top + cr.height / 2) + 'px';
    requestAnimationFrame(() => { s.style.transition = ''; });
  }

  React.useEffect(() => { updateStick(); }, [cur]);

  function openDialog() {
    clearTimeout(closeTimer.current);
    setOpen(true);
    setTimeout(() => {
      const s = gridRef.current && gridRef.current.querySelector('.cell.selected');
      if (s) s.focus();
    }, 50);
  }

  function closeDialog() {
    clearTimeout(closeTimer.current);
    setOpen(false);
  }

  function scheduleClose() {
    clearTimeout(closeTimer.current);
    closeTimer.current = setTimeout(closeDialog, 250);
  }

  React.useEffect(() => {
    function onKey(e) {
      if (e.key === 'Escape' && open) { closeDialog(); return; }
      if (!open) return;
      const ae = document.activeElement;
      if (!ae || !ae.classList || !ae.classList.contains('cell')) return;
      const ci = COLUMNS.indexOf(ae.dataset.col);
      const ri = ROWS.indexOf(ae.dataset.row);
      let nc = ci, nr = ri;
      if (e.key === 'ArrowLeft') nc = Math.max(0, ci - 1);
      else if (e.key === 'ArrowRight') nc = Math.min(COLUMNS.length - 1, ci + 1);
      else if (e.key === 'ArrowUp') nr = Math.max(0, ri - 1);
      else if (e.key === 'ArrowDown') nr = Math.min(ROWS.length - 1, ri + 1);
      else return;
      if (nc !== ci || nr !== ri) {
        e.preventDefault();
        const t = gridRef.current && gridRef.current.querySelector('.cell[data-col="' + COLUMNS[nc] + '"][data-row="' + ROWS[nr] + '"]');
        if (t) t.focus();
      }
    }
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [open]);

  function onCellClick(e) {
    const c = e.target.closest('.cell');
    if (!c) return;
    select(c.dataset.col, c.dataset.row, false);
    closeDialog();
  }

  function onPointerDown(e) {
    const c = e.target.closest('.cell');
    if (!c) return;
    setDragging(true);
    lastDrag.current = c;
    stickRef.current.classList.add('dragging');
    try { gridRef.current.setPointerCapture(e.pointerId); } catch (_) {}
    select(c.dataset.col, c.dataset.row, true);
    mvStick(e);
  }

  function onPointerMove(e) {
    if (!dragging) return;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const c = el && el.closest('.cell');
    if (c && c !== lastDrag.current) {
      lastDrag.current = c;
      select(c.dataset.col, c.dataset.row, true);
    }
    mvStick(e);
  }

  function endDrag() {
    if (!dragging) return;
    setDragging(false);
    lastDrag.current = null;
    stickRef.current.classList.remove('dragging');
    updateStick();
    closeDialog();
  }

  function mvStick(e) {
    const gr = gridRef.current.getBoundingClientRect();
    const s = stickRef.current;
    s.style.left = (e.clientX - gr.left) + 'px';
    s.style.top = (e.clientY - gr.top) + 'px';
  }

  const ci = COLUMNS.indexOf(cur.col);
  const ri = ROWS.indexOf(cur.row);
  const dots = ROWS.length - ri;

  const stars = [];
  for (let i = 0; i < 80; i++) {
    const sz = Math.random() * 2 + 0.5;
    stars.push(<div key={i} className="star" style={{ width: sz + 'px', height: sz + 'px', left: Math.random() * 100 + '%', top: Math.random() * 100 + '%', animationDelay: Math.random() * 4 + 's', animationDuration: (2 + Math.random() * 4) + 's' }} />);
  }

  return (
    <>
      <div className="stars">{stars}</div>
      <div className="demo">
        <h1>GEAR GRID · REACT</h1>
        <p>Data-driven 2D gear selector.</p>
        <small>COLUMNS × ROWS = auto grid</small>
      </div>
      <button className="fab" onClick={() => open ? closeDialog() : openDialog()} onMouseEnter={openDialog} onMouseLeave={scheduleClose} aria-haspopup="dialog" aria-expanded={open ? 'true' : 'false'}>
        <span className="f-glyph" style={{ color: COLORS[ci] }}>{GLYPHS[ci]}</span>
        <span>{cur.col}·{cur.row}</span>
        <span className="f-dots">
          {Array.from({ length: ROWS.length }, (_, i) => (
            <i key={i} style={{ background: i < dots ? COLORS[ci] : 'rgba(255,255,255,0.12)', boxShadow: i < dots ? '0 0 3px ' + COLORS[ci] : 'none' }} />
          ))}
        </span>
      </button>
      <div className={open ? 'dialog open' : 'dialog'} onMouseEnter={openDialog} onMouseLeave={scheduleClose} role="dialog" aria-modal="false">
        <div ref={gridRef} className="grid" role="grid" aria-label="2D selector" style={{ '--cols': COLUMNS.length, '--rows': ROWS.length }} onClick={onCellClick} onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={endDrag} onPointerCancel={endDrag}>
          <div className="corner" />
          {COLUMNS.map((c, i) => <div key={'c' + i} className="alabel" role="columnheader">{c}</div>)}
          {ROWS.map((r, ri2) => [
            <div key={'r' + ri2} className="alabel ylabel" role="rowheader">{r}</div>,
            ...COLUMNS.map((c, ci2) => {
              const isSel = cur.col === c && cur.row === r;
              const isRow = !isSel && cur.row === r;
              const isCol = !isSel && cur.col === c;
              const cls = 'cell' + (isSel ? ' selected' : '') + (isRow ? ' hl-row' : '') + (isCol ? ' hl-col' : '');
              const cDots = ROWS.length - ri2;
              return (
                <button key={'cell' + ci2 + ri2} type="button" className={cls} data-col={c} data-row={r} style={{ color: COLORS[ci2], background: 'rgba(' + COLORS[ci2].slice(1).match(/.{2}/g).map(h => parseInt(h, 16)).join(',') + ',0.04)' }} role="gridcell" aria-label={c + '·' + r} aria-selected={isSel ? 'true' : 'false'}>
                  <div className="glyph">{GLYPHS[ci2]}</div>
                  <div className="name">{c}·{r}</div>
                  <div className="dots">{Array.from({ length: ROWS.length }, (_, d) => <i key={d} className={d < cDots ? 'on' : ''} />)}</div>
                </button>
              );
            })
          ])}
          <div ref={stickRef} className={dragging ? 'stick dragging' : 'stick'} aria-hidden="true" />
        </div>
        <div className="readout">
          <div className="gear" style={{ color: COLORS[ci] }}>{GLYPHS[ci]}  {cur.col}·{cur.row}</div>
          <div className="sub">{cur.col} · {cur.row}</div>
        </div>
        <div className="legend">
          <span><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> move</span>
          <span><kbd>⏎</kbd> confirm</span>
          <span>hover · click · drag</span>
          <span><kbd>Esc</kbd> close</span>
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
